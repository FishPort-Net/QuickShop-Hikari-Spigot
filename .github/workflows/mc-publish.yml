# separate terms of service, privacy policy, and support
# documentation.

name: mc-publish

on:
  workflow_dispatch:
  release:
    types:
      - published
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: ./gradlew :quickshop-bukkit:shadowJar
      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ijC5dDkD
          modrinth-featured: true
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          github-discussion: Announcements
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-draft: false
          files: |
            quickshop-bukkit/build/libs/QuickShop-Hikari-*.jar
          loaders: |
            spigot
            paper
            purpur
          game-versions: |
            >=1.18.2 <=1.21.1
          game-version-filter: releases
          java: |
            17
            21
          dependencies: |
            essentialsx(optional)
            nbtapi(optional)
            discordsrv(optional)
            bluemap(optional)
            dynmap(optional)
            worldedit(optional)
            worldguard(optional)
            plan(optional)
            bentobox(optional)
            clearlag(optional)
            elitemobs(optional)
            griefprevention(optional)
            lands(optional)
            openinv(optional)
            placeholderapi(optional)
            residence(optional)
            towny(optional)
            superiorskyblock(optional)
            luckperms(optional)
            vault(optional)
            plan(optional)
            advancedregionmarket(optional)
            ecoenchants(optional)
            reforges(optional)
            packetlistenerapi(conflicting)
      - name: Build Translations
        uses: Ghost-chu/CrowdinCopyDeploy-action@master
        with:
          args: uploads3
        env:
          CROWDIN_ACCESS_TOKEN: ${{ secrets.CROWDIN_ACCESS_TOKEN }}
          CROWDIN_PROJECT_BRANCH_ID: '126'
          CROWDIN_PROJECT_ID: '524354'
          #DEPLOY_PATH: './deploy-prod'
          AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
      - name: Purge CloudFlare cache
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          # Zone is required by both authentication methods
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
