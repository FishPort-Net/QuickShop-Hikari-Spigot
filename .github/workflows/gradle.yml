name: Gradle CI

on:
  push:
    branches: [ hikari, cleanup ]
  pull_request:
    branches: [ hikari, cleanup ]

permissions:
  contents: read

jobs:
  main-plugin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Build main plugin
        run: ./gradlew :quickshop-bukkit:shadowJar

      - name: Upload main plugin
        uses: actions/upload-artifact@v7
        with:
          name: quickshop-java-${{ matrix.java }}
          path: quickshop-bukkit/build/libs/QuickShop-Hikari-*.jar
          if-no-files-found: error
